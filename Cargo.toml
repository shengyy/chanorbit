[package]
name = "chanorbit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight Chan-theory structure engine: inclusion, fractals, strokes, stroke centres and MACD interval power"
publish = false

[[bin]]
name = "chanorbit"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }

[dev-dependencies]
flate2 = "1.1"

[profile.release]
lto = true
codegen-units = 1
